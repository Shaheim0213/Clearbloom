<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearBloom - "Breathe easy, Bloom Freely"</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #87ceeb;
            background-color: #FFFFFF;
        }
        header {
            background: <div id="#87ceeb"></div>;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #87ceeb;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .hero {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(to right, #FFFFFF, #ffffff);
        }
        .section {
            padding: 40px 20px;
            max-width: 900px;
            margin: auto;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .feature {
            flex: 1 1 250px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #87ceeb;
            color: white;
        }
        .cta {
            background: #87ceeb
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
