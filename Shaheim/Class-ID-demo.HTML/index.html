<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunch Menu</title>

<style>
    body {
        font-family: "Poppins", sans-serif;
        background-color: #fff8f0;
        color: #333;
        margin: 40px;
    }

    h1 {
        text-align: center;
        color: #b34d00;
        font-size: 2.5em;
        margin-bottom: 40px;
    }

    .menu-section {
        margin-bottom: 40px;
        background: #ffffff;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .menu-section h2 {
        color: #ff6600;
        border-bottom: 2px solid #ffcc99;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    ul {
        list-style-type: disc;
        margin-left: 25px;
    }

    li {
        margin: 8px 0;
        font-size: 1.1em;
    }

    li::marker {
        color: #ff6600;
    }
</style>
</head>

<body>

    <h1>Lunch Menu</h1>

    <div class="menu-section">
        <h2>Appetizers</h2>
        <ul>
            <li>Breadsticks</li>
            <li>Salad</li>
            <li>Peanut Butter sandwich</li>
        </ul>
    </div>

    <div class="menu-section">
        <h2>Main Dishes</h2>
        <ul>
            <li>Pizza</li>
            <li>Chicken Tenders</li>  
            <li>Mozzerela Sticks</li>
        </ul>
    </div>

    <div class="menu-section">
        <h2>Desserts</h2>
        <ul>
            <li>Icey</li>
            <li>Cookies</li>
            <li>Fresh Fruit</li>
        </ul>
    </div>

</body>
</html>
